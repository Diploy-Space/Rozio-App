name: sixvalley_vendor_app
description: A new Flutter application.
publish_to: 'none'
version: 1.0.3+5

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9
  get_it: ^9.2.1
  provider: ^6.1.5+1
  connectivity_plus: ^7.3.1
  dio: ^5.11.1
  intl: 0.20.2
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  image_picker: ^1.2.3
  flutter_switch: ^0.3.2
  cached_network_image: ^3.4.1
  flutter_typeahead: ^6.0.0
  autocomplete_textfield: ^2.0.1
  dotted_border: ^3.1.0
  flutter_html: ^3.0.0-beta.2
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0
  path_provider: ^2.1.6
  country_code_picker: ^3.4.1
  pin_code_fields: ^9.4.0
  permission_handler: ^12.0.1
  barcode_widget: ^2.0.4
  file_picker: ^12.2.0
  url_launcher: ^6.3.2
  flutter_spinkit: ^5.2.2
  percent_indicator: ^4.2.5
  flutter_speed_dial: ^7.0.0
  barcode_scan2: ^4.7.2
  print_bluetooth_thermal: ^1.1.7
  screenshot: ^3.0.0
  esc_pos_utils: ^1.1.0
  flutter_slidable: ^4.0.3
  readmore: ^3.0.0
  #flutter_html_table: ^3.0.0
  google_maps_flutter: ^2.18.0
  geocoding: ^5.0.0
  geolocator: ^14.0.3
  syncfusion_flutter_datepicker: ^34.2.6
  textfield_tags: 2.0.2
  http: ^1.6.0
  path: ^1.9.1
  typed_data: ^1.4.0
  animated_floating_buttons: ^0.0.2
  emoji_picker_flutter: ^4.5.4
  syncfusion_flutter_charts: ^34.2.6
  carousel_slider: ^5.1.2
  flutter_downloader: ^1.12.1
  open_file: ^4.0.0
  open_file_manager:
    path: ./packages/open_file_manager
  just_the_tooltip: ^0.0.12
  syncfusion_flutter_pdfviewer: ^34.2.6
  audioplayers: ^5.2.0
  flutter_xlider: ^3.5.0
  video_player: ^2.7.0
  chewie: ^1.15.0
  get_thumbnail_video: ^0.7.3
  flutter_svg: ^2.3.0
  collection: any
  fluttertoast: ^9.1.0
  flutter_image_compress: ^2.5.1
  firebase_auth: ^6.6.1
  webview_flutter: ^4.14.1
  showcaseview: ^5.1.0
  phone_numbers_parser: ^9.0.26

dependency_overrides:
  audioplayers_android:
    path: ./packages/audioplayers_android
  wakelock_plus:
    path: ./packages/wakelock_plus
  syncfusion_flutter_core: ^34.2.6
  # esc_pos_utils 1.1.0 (latest, unmaintained) pins image ^3.x which caps xml at ^6,
  # while syncfusion_flutter_pdf 34.x requires xml ^7. Override to satisfy both.
  xml: ^7.0.1
  csslib: 0.17.2
  html: 0.15.0


dev_dependencies:
  icons_launcher:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter


icons_launcher:
  image_path: "assets/images/ic_launcher.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true
    macos:
      enable: true

flutter_icons:
  ios: true
  android: true
  image_path: "assets/images/ic_launcher.png"





flutter:
  uses-material-design: true
  config:
    disable-swift-package-manager: true

  assets:
    - assets/images/
    - assets/language/
    - assets/svg/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/font/roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/font/roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/font/roboto/Roboto-Bold.ttf
          weight: 700